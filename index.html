
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>@CRICMATCHSTREAM</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.header {
    width: 100%;
    height: 45px;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    border-bottom: 1px solid #292929;
}

.player {
    position: relative;
    width: 100%;
    height: calc(100dvh - 45px);
    background: #000;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

@media (orientation: landscape) {
    .header {
        display: none;
    }
    .player {
        height: 100dvh;
    }
}
</style>
</head>

<body>

<div class="header">@CRICMATCHSTREAM</div>

<div class="player">
    <iframe
        src="https://streamerraj.github.io/Hindi3/"
        title="Live Cricket Streaming"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="no-referrer">
    </iframe>
</div>

</body>
</html>
