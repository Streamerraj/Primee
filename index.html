<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>@Cricmatchstream</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

.shaka-video-container {
    width: 100%;
    height: 100%;
    background: #000;
}

#videoPlayer {
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
}

/* Telegram Popup */
#telegramPopup {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.85);
}

.popup-box {
    width: 100%;
    max-width: 340px;
    box-sizing: border-box;
    padding: 28px 22px;
    text-align: center;
    color: #fff;
    background: #151515;
    border: 1px solid #333;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

.telegram-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.popup-box h2 {
    margin: 0 0 10px;
    font-size: 23px;
}

.popup-box p {
    margin: 0 0 22px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.6;
}

.popup-button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.join-button {
    color: #fff;
    background: #229ED9;
}

.continue-button {
    color: #fff;
    background: #303030;
}
</style>
</head>

<body>

<div id="videoContainer" class="shaka-video-container">
    <video id="videoPlayer" playsinline autoplay unmuted></video>
</div>

<!-- Telegram Popup -->
<div id="telegramPopup" role="dialog" aria-modal="true"
     aria-labelledby="popupTitle">
    <div class="popup-box">
        <div class="telegram-icon">✈️</div>
        <h2 id="popupTitle">Join Our Telegram</h2>
        <p>Join <strong>@Cricmatchstream</strong> for updates and more links.</p>

        <a class="popup-button join-button"
           href="https://t.me/cricmatchstream"
           target="_blank"
           rel="noopener noreferrer">
            JOIN TELEGRAM
        </a>

        <button class="popup-button continue-button"
                id="continueButton"
                type="button">
            Already Joined
        </button>
    </div>
</div>

<script>
const STREAM_URL =
    "https://jiotvmblive.cdn.jio.com/bpk-tv/Ten_3_MOB/WDVLive/index.mpd";

const DRM_KEYS =
    "68318f7c97c55ba6ab8d0398a88fed3e:d312fb3325b4eb9462b4a0d2b6794adf";

const COOKIE_JSON_URL =
    "https://sonujson-v4.pages.dev/Data/sports.json";

const CHANNEL_ID = "STEN3";

const videoElement = document.getElementById("videoPlayer");
const videoContainer = document.getElementById("videoContainer");

let player;
let ui;

document.getElementById("continueButton").addEventListener("click", () => {
    document.getElementById("telegramPopup").style.display = "none";
});

function parseDrmKeys(value) {
    const clearKeys = {};

    const pairs = String(value || "")
        .split(",")
        .map(pair => pair.trim())
        .filter(Boolean);

    for (const pair of pairs) {
        const separator = pair.indexOf(":");
        if (separator === -1) continue;

        const kid = pair.slice(0, separator).trim().toLowerCase();
        const key = pair.slice(separator + 1).trim().toLowerCase();

        if (kid && key) clearKeys[kid] = key;
    }

    return clearKeys;
}

async function getCookie() {
    const response = await fetch(COOKIE_JSON_URL, {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error("Cookie JSON request failed: " + response.status);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.channels)) {
        throw new Error("Invalid JSON format.");
    }

    const channel = data.channels.find(item =>
        String(item.id || "").trim().toLowerCase() ===
        CHANNEL_ID.toLowerCase()
    );

    if (!channel) {
        throw new Error("Channel not found: " + CHANNEL_ID);
    }

    const cookie = String(channel.cookie || "").trim();

    if (!cookie) {
        throw new Error("Cookie not found for " + CHANNEL_ID);
    }

    return cookie;
}

function configureStreamRequests(cookie) {
    if (!cookie) return;

    const networkingEngine = player.getNetworkingEngine();
    if (!networkingEngine) return;

    networkingEngine.registerRequestFilter((type, request) => {
        if (!request.uris || !request.uris[0]) return;

        request.headers = request.headers || {};
        request.headers["Cookie"] = cookie;

        const url = request.uris[0];

        if (
            (type === 0 || type === 1) &&
            !url.includes("__hdnea=") &&
            !url.includes("__hdnea__") &&
            !url.includes("hdnts=")
        ) {
            request.uris[0] = url +
                (url.includes("?") ? "&" : "?") +
                cookie;
        }
    });
}

function configureDrm() {
    player.configure({
        drm: {
            clearKeys: parseDrmKeys(DRM_KEYS)
        },
        manifest: {
            defaultPresentationDelay: 5
        },
        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
        }
    });
}

async function initPlayer() {
    try {
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            throw new Error("This browser does not support Shaka Player.");
        }

        player = new shaka.Player();
        await player.attach(videoElement);

        ui = new shaka.ui.Overlay(
            player,
            videoContainer,
            videoElement
        );

        ui.configure({
            controlPanelElements: [
                "play_pause",
                "time_and_duration",
                "mute",
                "volume",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
            ]
        });

        player.addEventListener("error", event => {
            console.error("Shaka Player Error:", event.detail);
        });

        const cookie = await getCookie();
        configureStreamRequests(cookie);
        configureDrm();

        await player.load(STREAM_URL);

        try {
            await videoElement.play();
        } catch (error) {
            console.log("Autoplay blocked.");
        }
    } catch (error) {
        console.error("Player initialization failed:", error);
    }
}

initPlayer();

window.addEventListener("beforeunload", () => {
    if (player) {
        player.destroy().catch(() => {});
    }
});
</script>

</body>
</html>
